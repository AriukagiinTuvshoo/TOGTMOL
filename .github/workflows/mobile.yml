name: Capacitor workspace check

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: write

jobs:
  mobile-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx cap --version
      - run: CAPACITOR_SERVER_URL=https://togtmol.vercel.app npx cap sync android
      - name: Verify Android wrapper config
        working-directory: mobile
        run: |
          test -f android/app/src/main/assets/public/index.html
          grep -q 'android:scheme="togtmol"' android/app/src/main/AndroidManifest.xml
  android-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: CAPACITOR_SERVER_URL=https://togtmol.vercel.app npx cap sync android
      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

  ios-tooling:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: CAPACITOR_SERVER_URL=https://togtmol.vercel.app npx cap sync ios
      - run: CAPACITOR_SERVER_URL=https://togtmol.vercel.app npx cap sync android
      - run: npx cap doctor
