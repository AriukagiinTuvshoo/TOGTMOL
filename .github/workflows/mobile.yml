name: Capacitor workspace check

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: write

jobs:
  mobile-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx cap --version
      - run: npx cap doctor

  native-skeleton:
    if: github.event_name == 'pull_request' && github.head_ref == 'setup/capacitor-mobile-wrapper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Detect native projects
        id: native
        shell: bash
        run: |
          if [[ -d mobile/ios && -d mobile/android ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mobile dependencies
        if: steps.native.outputs.present == 'false'
        working-directory: mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate iOS project
        if: steps.native.outputs.present == 'false'
        working-directory: mobile
        run: npx cap add ios
      - name: Generate Android project
        if: steps.native.outputs.present == 'false'
        working-directory: mobile
        run: npx cap add android
      - name: Configure native deep links
        if: steps.native.outputs.present == 'false'
        working-directory: mobile
        run: node scripts/configure-native-deeplinks.mjs
      - name: Commit native projects
        if: steps.native.outputs.present == 'false'
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/ios mobile/android mobile/scripts/configure-native-deeplinks.mjs
          git rm -f .github/workflows/native-bootstrap.yml || true
          git commit -m "feat: bootstrap native Capacitor projects [skip-native-bootstrap]"
          git push origin "HEAD:$BRANCH"
