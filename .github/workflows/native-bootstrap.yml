name: Bootstrap native Capacitor projects

on:
  push:
    branches:
      - setup/capacitor-mobile-wrapper
    paths:
      - "mobile/package.json"
      - "mobile/capacitor.config.ts"
      - "mobile/scripts/configure-native-deeplinks.mjs"
      - ".github/workflows/native-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !github.event.head_commit.message || !contains(github.event.head_commit.message, '[skip-native-bootstrap]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: setup/capacitor-mobile-wrapper
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx cap add ios
      - run: npx cap add android
      - run: node scripts/configure-native-deeplinks.mjs
      - name: Commit native projects
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/ios mobile/android mobile/scripts/configure-native-deeplinks.mjs
          git rm .github/workflows/native-bootstrap.yml
          git commit -m "feat: bootstrap native Capacitor projects [skip-native-bootstrap]"
          git push
