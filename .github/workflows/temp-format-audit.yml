name: Temporary format audit branch
on:
  push:
    branches: [audit-v7-stability]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-v7-stability
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "chore: format audit branch"
          git push origin audit-v7-stability
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/temp-format-audit.yml
          git add .github/workflows/temp-format-audit.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove temporary format workflow"
          git push origin audit-v7-stability
