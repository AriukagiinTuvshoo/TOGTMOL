name: One-time Prettier normalization

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: togtmol-format-normalize
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format repository
        run: npx prettier --write .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git add .
          git commit -m "chore: normalize repository formatting"
          git push
