name: Format V7 stylesheet

on:
  push:
    branches:
      - v7/fast-premium-pass

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/v7-fast-pass.css
      - name: Commit formatted CSS
        run: |
          if git diff --quiet -- app/v7-fast-pass.css; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v7-fast-pass.css
          git commit -m "style(v7): apply prettier formatting"
          git push
