name: Format music branch
on:
  push:
    branches:
      - music-native-redesign
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: music-native-redesign
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write components/music/music-player.tsx components/music/music-provider.tsx lib/persistence/repository.ts tests/music-player.test.tsx tests/music.test.ts tests/ui.test.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/music/music-player.tsx components/music/music-provider.tsx lib/persistence/repository.ts tests/music-player.test.tsx tests/music.test.ts tests/ui.test.tsx
          git commit -m "chore: format music redesign"
          git push origin HEAD:music-native-redesign
