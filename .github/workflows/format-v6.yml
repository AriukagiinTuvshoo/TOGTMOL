name: Format v6 branch
on:
  push:
    branches:
      - v6-neon-redesign
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v6-neon-redesign
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format v6 files
        run: |
          npx prettier --write \
            app/globals.css \
            app/knowledge.css \
            app/neon.css \
            components/calendar/study-calendar.tsx \
            components/dashboard/overview.tsx \
            components/knowledge/hub.tsx \
            components/settings/settings.tsx \
            components/settings/timer-sound-settings.tsx \
            components/subjects/subjects.tsx \
            components/timer/study-timer.tsx \
            components/ui/animated-buddy.tsx \
            components/world/room-scene.tsx \
            components/world/study-room.tsx \
            hooks/use-study.tsx \
            lib/notifications.ts \
            lib/persistence/actions.ts \
            lib/persistence/store.ts \
            lib/timer-alerts.ts \
            lib/world/room-themes.ts \
            tests/ui.test.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css app/knowledge.css app/neon.css \
            components/calendar/study-calendar.tsx \
            components/dashboard/overview.tsx \
            components/knowledge/hub.tsx \
            components/settings/settings.tsx \
            components/settings/timer-sound-settings.tsx \
            components/subjects/subjects.tsx \
            components/timer/study-timer.tsx \
            components/ui/animated-buddy.tsx \
            components/world/room-scene.tsx \
            components/world/study-room.tsx \
            hooks/use-study.tsx \
            lib/notifications.ts \
            lib/persistence/actions.ts \
            lib/persistence/store.ts \
            lib/timer-alerts.ts \
            lib/world/room-themes.ts \
            tests/ui.test.tsx
          git commit -m "chore: format v6 branch"
          git push origin HEAD:v6-neon-redesign
