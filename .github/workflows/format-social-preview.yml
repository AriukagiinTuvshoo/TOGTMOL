name: Format social preview

on:
  push:
    branches:
      - ux/social-preview

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/opengraph-image.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet -- app/opengraph-image.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/opengraph-image.tsx
          git commit -m "style: format Open Graph image"
          git push
