name: Bootstrap Capacitor web lockfile

on:
  push:
    branches:
      - setup/capacitor-mobile-wrapper
    paths:
      - "package.json"
      - ".github/workflows/capacitor-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: setup/capacitor-mobile-wrapper
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/capacitor-lock-bootstrap.yml
          git commit -m "chore: lock Capacitor auth plugins"
          git push
