name: Format test files

on:
  push:
    branches:
      - fix/production-build-stability

permissions:
  contents: write

jobs:
  format:
    if: !startsWith(github.event.head_commit.message, 'chore(format):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-build-stability
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/knowledge-ui.test.tsx tests/music-player.test.tsx tests/ui.test.tsx
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/knowledge-ui.test.tsx tests/music-player.test.tsx tests/ui.test.tsx
          git commit -m "chore(format): normalize test file formatting"
          git push origin HEAD:fix/production-build-stability
